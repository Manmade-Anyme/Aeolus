# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Remote (Depot) build stays the primary path -- it is faster and keeps
      # the build off the runner. It is capped rather than trusted: Fly's Depot
      # builder was unreachable for four consecutive deploys (runs #5-#7 plus a
      # re-run, 2026-07-27..31), each burning two 5-minute "Waiting for depot
      # builder..." stalls before "error building: context deadline exceeded".
      # The last healthy remote deploy (run #4) finished in 78s, so 5 minutes is
      # ample headroom for a working builder and cuts a stalled one short.
      - id: remote_build
        continue-on-error: true
        timeout-minutes: 5
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Fallback only: builds on the runner's own Docker daemon and pushes to
      # Fly's registry, so an unavailable Depot builder cannot block a deploy.
      # Slower (no shared build cache), which is why it is second, not first.
      - if: steps.remote_build.outcome != 'success'
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
