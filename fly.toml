# fly.toml app configuration file for aeolus
#
# AEOLUS is a scheduler-driven batch app: it runs one trading session and
# exits. No HTTP service is exposed; Fly restart policy / scheduling handles
# machine lifecycle.
#
# See https://fly.io/docs/reference/configuration/ for details.

app = 'aeolus'
primary_region = 'bom'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
