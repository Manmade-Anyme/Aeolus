app = 'aeolus'
primary_region = 'bom'

[build]
  builder = 'dockerfile'

[env]
  # SUPABASE_URL, SUPABASE_ANON_KEY, MARKET_DISCORD_WEBHOOK_URL, STATUS_DISCORD_WEBHOOK_URL
  # must be set as secrets via: flyctl secrets set SUPABASE_URL=...

[[services]]
  processes = ['app']
  protocol = 'tcp'
  internal_port = 8080

[vm]
  memory = '1gb'
  cpus = 1
