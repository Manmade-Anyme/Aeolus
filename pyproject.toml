[project]
name = "aeolus"
version = "0.1.0"
description = "NIFTY regime & premium-movement forecasting system — a weather app for the market, not a signal generator"
requires-python = ">=3.11"
dependencies = [
    # Populated per-module as directives are implemented (TASK-001..013).
    # Expected: dhanhq, supabase, httpx/websockets, pydantic, apscheduler
    "pydantic>=2.0",
    "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeolus"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
