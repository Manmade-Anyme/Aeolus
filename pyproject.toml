[project]
name = "aeolus"
version = "0.1.0"
description = "NIFTY regime & premium-movement forecasting system — a weather app for the market, not a signal generator"
requires-python = ">=3.11"
dependencies = [
    # Populated per-module as directives are implemented (TASK-001..013).
    # Expected: apscheduler (TASK-013)
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "supabase>=2.0",
    "dhanhq>=2.2.0",
    "pandas>=1.4.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeolus"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[[tool.mypy.overrides]]
module = ["dhanhq.*", "pandas.*"]
ignore_missing_imports = true
